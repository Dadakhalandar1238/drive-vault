services:
  - type: web
    name: drive-vault
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_DRIVES_PER_USER
        value: "10"
      - key: MAX_WORKERS
        value: "10"
